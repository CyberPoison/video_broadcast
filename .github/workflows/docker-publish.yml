name: Build and Publish Docker Image

# This workflow builds the Docker image and pushes it to GitHub Container Registry (GHCR).
# It triggers on pushes to the main/master branches, or when a release/version tag is created.
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Define default permissions required to publish packages on GitHub
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase (e.g. ghcr.io/username/repo-name)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU to enable multi-architecture builds (AMD64 & ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx (extended build capabilities)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry (GHCR)
      # Secrets.GITHUB_TOKEN is automatically provided by GitHub Actions
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract standard metadata (tags, labels) for Docker image
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Generates tags like 'latest', branch name, PR number, or 'v1.0.0' depending on trigger
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # Build and push the multi-platform Docker image to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          # Builds natively for both Standard Intel/AMD (x86_64) and ARM (e.g., Apple Silicon, Raspberry Pi, AWS Graviton)
          platforms: linux/amd64,linux/arm64
          # Utilize GitHub Actions cache to speed up subsequent builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max
